[package]
name = "crossmool"
version = "0.1.0"
edition = "2021"
authors = ["crossmool <dev@crossmool>"]
description = "Rust utilities for SM2/SM3/SM4 compatible with crossmool Java implementation."
license = "MIT OR Apache-2.0"

[lib]
name = "crossmool"
path = "src/lib.rs"

[dependencies]
base64 = "0.21"
hex = "0.4"
rand = "0.8"
# The user requested ckb-crypto for SM2/SM3 and an independent sm4 crate for SM4.
# Pin to wildcard so cargo will fetch the latest compatible versions.
# You may want to replace "*" with a specific version that works in your environment.
ckb-crypto = "=1.0.1"
sm2 = "0.13.3"
sm3 = "0.4.2"
sm4 = "0.5.1"
hmac = "0.12"
generic-array = "0.14"
