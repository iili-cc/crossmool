[package]
name = "crossmool"
version = "1.0.0"
edition = "2021"
authors = ["crossmool <dev@crossmool>"]
description = "Rust utilities for SM2/SM3/SM4 compatible with crossmool Java implementation."
license = "MIT OR Apache-2.0"
repository = "https://gitee.com/iili/crossmool"
documentation = "https://gitee.com/iili/crossmool/readme.md"

[lib]
name = "crossmool"
path = "src/lib.rs"

[dependencies]
base64 = "0.21"
hex = "0.4"
rand = "0.8"
ckb-crypto = "=1.0.1"
sm2 = "0.13.3"
sm3 = "0.4.2"
sm4 = "0.5.1"
hmac = "0.12"
generic-array = "0.14"
subtle = "2"
